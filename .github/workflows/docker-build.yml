name: Docker Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the version tag already exists in GHCR'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          IMAGE="ghcr.io/${REPO}"
          SHA=$(git rev-parse --short=7 HEAD)
          VERSION=$(node -p "require('./package.json').version")

          echo "### Build" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$FORCE" != "true" ]] && docker manifest inspect "${IMAGE}:${VERSION}" > /dev/null 2>&1; then
            echo "⏭️ admin-mcp@${VERSION} — already exists in GHCR" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "✅ admin-mcp@${VERSION} — building" | tee -a "$GITHUB_STEP_SUMMARY"

          TAG_ARGS=(
            -t "${IMAGE}:${VERSION}"
            -t "${IMAGE}:${SHA}"
            -t "${IMAGE}:latest"
          )
          if [[ "$EVENT" == "release" ]]; then
            TAG_ARGS+=(-t "${IMAGE}:${RELEASE_TAG}")
          fi

          docker buildx build \
            --platform linux/amd64 \
            --push \
            --cache-from "type=gha,scope=admin-mcp" \
            --cache-to "type=gha,mode=max,scope=admin-mcp" \
            "${TAG_ARGS[@]}" \
            .
